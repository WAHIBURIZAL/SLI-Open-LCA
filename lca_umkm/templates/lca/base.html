{% load static %}
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LCA UMKM Indonesia</title>
  <link rel="icon" href="data:image/x-icon;base64,AAABAAEAEBAAAAAAIABoBAAAFgAAACgAAAAQAAAAIAAAAAEAIAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=">
  <link rel="stylesheet" href="{% static 'lca/css/app.css' %}">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="{% url 'dashboard_lca' %}"><span>LCA</span> UMKM</a>
    <nav>
      <a href="{% url 'dashboard_lca' %}">Dashboard</a>
      <a href="{% url 'database_lca' %}">Database Inventory</a>
      <a href="/admin/">Admin</a>
    </nav>
  </header>

  <main class="page">
    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <div class="message {{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
